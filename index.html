<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>5공장 재고 약도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 회사 탭(가로 스크롤) + 보기 탭 3개(약도/품목/보내기), 상자 누르면 하단 시트. 콘크리트 바닥 톤 + 안전 노랑 강조 */
:root{
  --bg:#e9ecef; --surface:#ffffff; --surface2:#f4f6f8; --ink:#1a1f25; --muted:#5b6570; --line:#cfd5db;
  --accent:#f2b705; --accent-ink:#1a1f25;
  --g0:#2f6fd6; --g1:#d9662b; --g2:#2a9467; --g3:#8a4fd1; --g4:#c23b6b; --g5:#2f97a8; --mark:#7a8590;
  --good:#1f8a4c; --warn:#c2410c; --good-bg:#e3f4ea; --warn-bg:#fdebdf;
  --has-bg:#cfe8ff; --has-ink:#1f4f86; --seq-bg:#1d5fd1; --seq-stripe:#0d3a8a;
  --two-bg:#f6b7b7; --two-bd:#d42a2a; --two-cell:#fde3e3;
  --fix-bg:#ffd84a; --fix-bd:#c99700; --fix-ink:#1a1f25;
  --lock-bg:#fff4c2; --lock-bd:#ecd77a;
  --font-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --cell:66px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181d; --surface:#1d232a; --surface2:#252c34; --ink:#e8ecf0; --muted:#9aa5b1; --line:#36404a;
    --accent:#f5c22b; --accent-ink:#14181d;
    --g0:#6a9cf0; --g1:#f08a52; --g2:#4cc08e; --g3:#b38af0; --g4:#f07aa3; --g5:#5cc6d6; --mark:#8b96a1;
    --good:#4cc07a; --warn:#ff8a4c; --good-bg:#183526; --warn-bg:#3a2216; --has-bg:#1d3a5c; --has-ink:#9cc6f5; --seq-bg:#2f74e6; --seq-stripe:#a9c8ff; --two-bg:#6b1f1f; --two-bd:#ff5a5a; --two-cell:#3d1717; --fix-bg:#e6b800; --fix-bd:#ffd84a; --fix-ink:#14181d; --lock-bg:#3d3514; --lock-bd:#6b5c1f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181d; --surface:#1d232a; --surface2:#252c34; --ink:#e8ecf0; --muted:#9aa5b1; --line:#36404a;
  --accent:#f5c22b; --accent-ink:#14181d;
  --g0:#6a9cf0; --g1:#f08a52; --g2:#4cc08e; --g3:#b38af0; --g4:#f07aa3; --g5:#5cc6d6; --mark:#8b96a1;
  --good:#4cc07a; --warn:#ff8a4c; --good-bg:#183526; --warn-bg:#3a2216; --has-bg:#1d3a5c; --has-ink:#9cc6f5; --seq-bg:#2f74e6; --seq-stripe:#a9c8ff; --two-bg:#6b1f1f; --two-bd:#ff5a5a; --two-cell:#3d1717; --fix-bg:#e6b800; --fix-bd:#ffd84a; --fix-ink:#14181d; --lock-bg:#3d3514; --lock-bd:#6b5c1f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink)}

header{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 0 0;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:10px;padding:0 16px}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1;text-wrap:balance}
.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.pill{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.pill.ok{color:var(--good)} .pill.bad{color:var(--warn)}
.ctabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}
.ctabs::-webkit-scrollbar{display:none}
.ctab{flex:none;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 11px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ctab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ctab .cnt{font-family:var(--font-num);font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;background:var(--accent);color:var(--accent-ink)}
.ctab .cnt.zero{background:var(--good-bg);color:var(--good)}
.summary{display:flex;gap:6px;margin:8px 0 0;flex-wrap:wrap;padding:0 16px}
.summary span{font-size:12px;color:var(--muted)}
.summary b{color:var(--ink);font-family:var(--font-num)}
nav.views{display:flex;margin-top:6px;padding:0 16px}
nav.views button{flex:1;border:0;background:none;padding:10px 0 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
nav.views .navimg{flex:none;margin:6px 0 6px 6px;padding:0 12px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;font-size:13px;font-weight:700}
nav.views button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{flex:1;min-height:0;overflow:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.view{display:none} .view.on{display:block}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:disabled{opacity:.4}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 11px;min-height:40px;font-weight:600}
.seg button:disabled{opacity:.35}
.seg span{padding:0 6px;align-self:center;font-size:13px;color:var(--muted);min-width:44px;text-align:center}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;font-weight:600}
.banner button{margin-left:auto;border:1px solid var(--accent-ink);background:none;border-radius:8px;padding:6px 10px;font-weight:600}
.maptabs{display:flex;margin-bottom:10px;width:100%}
.maptabs button{flex:1;font-size:15px}
.maptabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.maptabs small{font-family:var(--font-num);font-size:12px;opacity:.75}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.mapwrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;max-height:calc(100vh - 300px);min-height:300px}
.grid{display:grid;gap:4px;width:max-content}
.cell{width:var(--cell);height:var(--cell);border-radius:8px;border:1px dashed var(--line);background:transparent;padding:0;position:relative}
.cell.empty::after{content:"";position:absolute;inset:50% auto auto 50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--line)}
.cell.empty.place:active{background:var(--surface2)}
.cell.target{border-color:var(--accent);border-style:solid;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.box{border:1.5px solid var(--line);border-style:solid;background:var(--surface2);display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;overflow:hidden;text-align:left}
.box .stripe{height:5px;background:var(--grp,var(--mark));flex:none}
.box .t1{font-size:9.5px;color:var(--muted);padding:2px 4px 0;line-height:1.1;font-family:var(--font-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .t2{font-size:15px;font-weight:700;padding:0 4px;line-height:1.1;font-family:var(--font-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .t2.s{font-size:12px} .box .t2.xs{font-size:10px}
.box .t3{font-size:11px;padding:0 4px 3px;line-height:1.15;font-family:var(--font-num);color:var(--muted);white-space:nowrap}
.box .t3 b{color:var(--ink)}
.box.has{background:var(--has-bg)}
.box.has .t1{color:var(--has-ink)}
.box.done{border-color:var(--good)} .box.diff{border-color:var(--warn)}
.box.done .t3 b{color:var(--good)} .box.diff .t3 b{color:var(--warn)}
.box .flag{position:absolute;top:7px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.box.unset{border-style:dashed;border-color:var(--muted);align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.box.mark{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 6px,var(--bg) 6px,var(--bg) 12px);align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);border-style:solid}
.box.sel{outline:3px solid var(--accent);outline-offset:1px}

.grp-h{display:flex;align-items:center;gap:8px;margin:16px 0 6px;font-size:13px;font-weight:700;color:var(--muted)}
.grp-h:first-child{margin-top:4px}
.grp-h i{width:10px;height:10px;border-radius:3px;background:var(--grp)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;align-items:center}
.row:first-child{border-top:0}
.row .code{font-family:var(--font-num);font-weight:600;font-size:15px;word-break:break-all}
.row .code small{font-weight:500;color:var(--muted);font-size:13px}
.row .qty{font-family:var(--font-num);font-size:14px;text-align:right;white-space:nowrap}
.row .qty b{font-size:16px}
.row .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.row .note{color:var(--warn)}
.row .tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.row .tag.done{background:var(--good-bg);color:var(--good)} .row .tag.diff{background:var(--warn-bg);color:var(--warn)}
.row.info{background:var(--surface2)}
.row.info .code{font-family:var(--font-body)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px}
.card p{margin:0 0 10px;color:var(--muted);font-size:13px;max-width:65ch}
textarea{width:100%;min-height:260px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);padding:10px;font-family:var(--font-num);font-size:13px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:110px}
.field input,.field select{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-size:15px}

.scrim{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:20;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:88%;display:none;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet.on{display:flex}
.sh-head{padding:10px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sh-head .grip{position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
.sh-head h3{margin:6px 0 0;font-size:18px;flex:1;font-family:var(--font-num);word-break:break-all}
.sh-head h3 small{display:block;font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:500}
.x{border:0;background:var(--surface2);width:36px;height:36px;border-radius:50%;font-size:18px;margin-top:6px;flex:none}
.sh-body{overflow:auto;padding:12px 16px calc(18px + env(safe-area-inset-bottom))}
.prevbox{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:stretch;margin-bottom:12px}
.prevnum{background:var(--surface2);border-radius:12px;padding:8px 12px;text-align:center;min-width:92px}
.prevnum label{display:block;font-size:12px;color:var(--muted)}
.prevnum input{width:70px;border:0;background:none;text-align:center;font-family:var(--font-num);font-size:28px;font-weight:600;padding:0}
.notebox{background:var(--warn-bg);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column}
.notebox.emp{background:var(--surface2)}
.notebox label{font-size:12px;color:var(--warn);font-weight:600}
.notebox.emp label{color:var(--muted)}
.notebox input{border:0;background:none;font-size:16px;padding:4px 0;width:100%}
.unitrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.unitrow input{width:64px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-family:var(--font-num);font-size:15px;text-align:center}
.unitrow button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600}
.curhead{display:flex;align-items:baseline;gap:10px;margin:4px 0 8px}
.curhead .lbl{font-weight:700}
.curhead .total{font-family:var(--font-num);font-size:30px;font-weight:600;margin-left:auto}
.curhead .d{font-family:var(--font-num);font-size:14px;font-weight:600;padding:2px 8px;border-radius:8px}
.d.zero{background:var(--good-bg);color:var(--good)} .d.pos,.d.neg{background:var(--warn-bg);color:var(--warn)}
.spots{background:var(--surface2);border-radius:10px;padding:4px 10px;margin-bottom:10px}
.spot{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.spot:first-child{border-top:0}
.spot b{font-family:var(--font-num);color:var(--ink)}
.spot.me{color:var(--ink);font-weight:600}
.curhead.sub .total{font-size:22px}
.survey{border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--surface));color:var(--ink);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700}
.survey.old{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.survey.snap{border-color:var(--muted);background:var(--surface2)}
.snapb{margin:8px 0 0;flex-wrap:wrap;font-size:14px}
.snapb button{margin-left:0}
.snapb span{flex:1 1 100%}
.ro{font-family:var(--font-num);font-size:24px;font-weight:600}
.prevrec{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:6px 6px 6px 12px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.prevrec span{flex:1}
.prevrec b{font-family:var(--font-num);color:var(--ink);font-size:15px}
.prevrec .btn{min-height:34px;padding:6px 12px}
.hrow{display:flex;align-items:center;gap:8px}
.hrow .code{flex:1;min-width:0}
.hrow .code small{display:block;font-family:var(--font-body);font-size:12px}
.hbtns{display:flex;gap:6px}
.hbtns .btn{min-height:36px;padding:6px 11px}
#unitCard summary{cursor:pointer;list-style:revert}
.urow{display:flex;align-items:center;gap:10px}
.urow .code{flex:1;min-width:0}
.uin{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.uin input{width:64px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-family:var(--font-num);font-size:15px;text-align:center}
.sizer{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.sizer .sl{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--muted)}
.sizer .btn{padding:8px 4px;font-size:13px;min-height:38px}
.box.seqbox{background:var(--seq-bg);border-color:var(--seq-bg);--grp:var(--seq-stripe);color:#fff}
.box.seqbox .t2,.box.seqbox .t3,.box.seqbox .t3 b{color:#fff}
.box.seqbox .t3{opacity:.9}
.mkown{margin-top:8px}
.mkown[hidden]{display:none}
.btn.mkseq{background:var(--seq-bg);border-color:var(--seq-bg);color:#fff}
.box.mark{word-break:keep-all;text-align:center;line-height:1.15;padding:2px}
.seqnote{color:var(--warn)}
.sqrow{display:flex;align-items:center;gap:8px}
.sqrow .code{flex:1;min-width:0}
.sqrow.on{background:var(--warn-bg)}
.sqt{display:block;font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:500}
.sqc{display:flex;align-items:center;gap:4px}
.sqc button{border:1px solid var(--line);background:var(--surface);width:32px;height:34px;border-radius:8px;font-size:17px;font-weight:600}
.sqc button{width:auto;min-width:36px;padding:0 6px;font-size:14px}
.sqc .minus{color:var(--warn);border-color:var(--warn)}
.sqc .plus{color:var(--good);border-color:var(--good)}
.sqc input.pos{color:var(--good)}
.sqrow.onp{background:var(--good-bg)}
.sqc .undo{color:var(--muted)}
.sqc .undo:disabled{opacity:.35}
.sqc .squ{width:auto;padding:0 8px;font-size:13px}
.sqc input{width:52px;color:var(--warn);font-weight:600;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);text-align:center;font-family:var(--font-num);font-size:15px}
.sqv{font-family:var(--font-num);color:var(--warn)}
.box{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.box.dragging{opacity:.35}
.box.dropfrom{outline:3px dashed var(--accent);outline-offset:1px}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 10px 24px rgba(0,0,0,.3);margin:0}
.cell.dropto{outline:3px solid var(--accent);outline-offset:1px;background:color-mix(in srgb,var(--accent) 18%,transparent)}
.list.recent{border-color:var(--accent)}
.boxfind{margin-top:10px}
.boxfind .search{margin-bottom:4px;border-color:var(--accent)}
#bqInfo b{color:var(--ink);font-family:var(--font-num)}
.linkbtn{border:0;background:none;color:var(--ink);font-weight:700;text-decoration:underline;padding:0;font-size:12px}
.grid.finding .box.dim{opacity:.22;filter:grayscale(1)}
.grid.finding .box.hit{outline:3px solid var(--accent);outline-offset:1px;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 35%,transparent);animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}to{box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 15%,transparent)}}
@media (prefers-reduced-motion: reduce){.grid.finding .box.hit{animation:none}}
.ov{position:fixed;inset:0;z-index:19;background:var(--bg);display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.ov.on{display:flex}
.ovhead{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px 4px}
.ovtop{display:flex;align-items:center;gap:10px;margin-bottom:6px}

.ovtop .x{margin-top:0}
.ovhead .search{margin-bottom:2px;border-color:var(--accent)}

.ovgrid.finding .box.hit{outline:3px solid var(--accent);outline-offset:0;z-index:1}
.ovfoot{text-align:center;margin:4px 0 8px}
.c-white{--cbg:#ffffff;--cfg:#1a1f25;--cbd:#9aa5b1}
.c-blue{--cbg:#1d5fd1;--cfg:#ffffff;--cbd:#1d5fd1}
.c-red{--cbg:#d23a3a;--cfg:#ffffff;--cbd:#d23a3a}
.c-yellow{--cbg:#f5c400;--cfg:#1a1f25;--cbd:#d9ad00}
.cchip{display:inline-block;background:var(--cbg);color:var(--cfg);border:1.5px solid var(--cbd);border-radius:7px;padding:1px 7px}

.box.colored{background:var(--cbg)!important;border-color:var(--cbd)}

.donemark{position:absolute;right:3px;bottom:3px;width:16px;height:16px;border-radius:50%;background:var(--good);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.sizer .insbtn{grid-column:1/-1;margin-top:4px;border-style:dashed}
.grid.insmode .cell{border-color:var(--accent)}
.grid{--hdw:22px}
.ovgrid{--hdw:14px}
.hd{display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:11px;font-weight:600;color:var(--muted);user-select:none}
.hd.hc{height:18px;align-self:end}
.hd.corner{flex-direction:column;align-items:flex-end;justify-content:center;font-size:8px;font-family:var(--font-body);line-height:1.05;height:18px;white-space:nowrap;color:var(--muted);font-weight:500}
.hd.corner i{font-style:normal}
.ovgrid .hd{font-size:8px}
.ovgrid .hd.hc{height:12px}
.ovgrid .hd.corner{height:12px;font-size:0}
.stack{display:flex;flex-direction:column;gap:3px;width:var(--cell);height:calc(var(--cell) * 1.75)}
.cell.half{height:auto;flex:1;width:100%;border-radius:6px;min-height:0}
.box.half .stripe{height:3px}
.box.half .t1{font-size:9px}
.box.half .t2{font-size:14px}
.box.half .t2.s{font-size:11.5px}
.box.half .t2.xs{font-size:10px}
.box.half .t3{font-size:10.5px}
.box.half .flag,.box.half .donemark{width:14px;height:14px;min-width:14px;font-size:9px}
.box.half.mark,.box.half.unset{font-size:11px}
.cell.half.empty::after{width:3px;height:3px}
.hd.hr{border:0;background:none;padding:0;cursor:pointer;flex-direction:column;line-height:1.05;border-radius:6px}
.hd.hr:active{background:var(--surface2)}
.hd.hr small{font-size:9px;color:var(--surface);background:var(--muted);font-weight:700;border-radius:4px;padding:0 2px;margin-top:2px;font-family:var(--font-body)}
.ovgrid .stack{gap:1px}
.ovgrid.small .box.half .t1,.ovgrid.tiny .box.half .t1,.ovgrid.tiny .box.half .t3{display:none}
.hd.hr.two{font-weight:800}
.ovgrid .hd.hr small{font-size:6px}
.gongnote{background:var(--has-bg);color:var(--has-ink);border-radius:10px;padding:8px 10px}
.gongnote b{font-family:var(--font-num)}
.closebtn{border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700}
.closebtn.on{background:var(--ink);color:var(--surface)}
.survey.locked{border-color:var(--ink);background:var(--lock-bg)}
.grid.locked .cell.empty,.grid.locked .box.unset{background:var(--lock-bg);border-color:var(--lock-bd);border-style:solid}
.grid.locked .stack .cell.empty{background:var(--lock-bg)}
.grid.locked .cell.empty::after{display:none}
.grid .cell.empty.picked{background:var(--accent);border:2px solid var(--accent-ink);border-style:solid}
.cell.empty.picked::after{content:"✓";width:auto;height:auto;margin:0;inset:50% auto auto 50%;transform:translate(-50%,-50%);background:none;color:var(--accent-ink);font-weight:800;font-size:18px;border-radius:0}
.multib{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:15;margin:0;box-shadow:0 8px 24px rgba(0,0,0,.25);flex-wrap:wrap}
.multib span{flex:1 1 100%}
.multib button{margin-left:0}
.multib button:disabled{opacity:.4}
.box.fixed{background:var(--fix-bg)!important;border:2.5px solid var(--fix-bd)!important;color:var(--fix-ink)}
.box.fixed .t1,.box.fixed .t2,.box.fixed .t3,.box.fixed .t3 b{color:var(--fix-ink)!important}
.box.fixed::before{content:"고정";position:absolute;right:3px;top:7px;font-size:9px;font-weight:800;background:var(--fix-bd);color:#fff;border-radius:4px;padding:0 3px;line-height:1.4;z-index:1}
.box.fixed .flag{right:32px}
.box.fixed.half::before{top:4px}
.box.fixed.half .flag{top:4px}
.box.fixed.mark,.box.fixed.unset{background-image:none}
.fixbtn{border-color:var(--fix-bd)}
.fixbtn.on{background:var(--fix-bg);border-color:var(--fix-bd);color:var(--fix-ink)}
.palette{display:flex;gap:6px;flex-wrap:wrap}
.sw{min-width:42px;height:42px;border-radius:10px;border:2px solid var(--cbd);background:var(--cbg);color:var(--cfg);font-weight:800;font-size:15px}
.sw.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.sw.none{background:var(--surface);color:var(--muted);border:1.5px dashed var(--line);font-size:13px;padding:0 10px}
.p-red{--cbg:#e53935;--cfg:#fff;--cbd:#b71c1c;--plt:#fbd3d2}
.p-orange{--cbg:#fb8c00;--cfg:#1a1f25;--cbd:#c46a00;--plt:#ffe2bf}
.p-yellow{--cbg:#fdd835;--cfg:#1a1f25;--cbd:#c9a800;--plt:#fff6c4}
.p-green{--cbg:#43a047;--cfg:#fff;--cbd:#2e7d32;--plt:#d5efd6}
.p-blue{--cbg:#1e88e5;--cfg:#fff;--cbd:#1565c0;--plt:#d3e7fa}
.p-navy{--cbg:#283593;--cfg:#fff;--cbd:#1a237e;--plt:#d3d6ee}
.p-purple{--cbg:#8e24aa;--cfg:#fff;--cbd:#6a1b9a;--plt:#ecd3f2}
.cell.empty.painted{background:var(--plt);border:1.5px solid var(--cbd)}
.box.colored.mark,.box.colored.unset,.box.colored.seqbox{background-image:none;color:var(--cfg)}
.box.colored.seqbox .t2,.box.colored.seqbox .t3{color:var(--cfg)}
.box.bpicked{outline:4px solid var(--accent);outline-offset:1px;box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 35%,transparent)}
.tiertag{position:absolute;left:0;top:0;z-index:1;font-style:normal;font-size:9px;font-weight:800;line-height:1.3;padding:1px 4px;border-radius:6px 0 6px 0;background:var(--ink);color:var(--surface)}
.box.half.mark,.box.half.unset{padding-top:8px}
.cell.half.empty::after{content:attr(data-tl);width:auto;height:auto;background:none;border-radius:0;margin:0;inset:50% auto auto 50%;transform:translate(-50%,-50%);font-size:11px;font-weight:700;color:var(--muted)}
.ovgrid .tiertag{font-size:7px;padding:0 2px}
.ovgrid.tiny .tiertag{display:none}
.mixt1{background:var(--ink);color:var(--surface);border-radius:3px;padding:0 3px;font-family:var(--font-body);font-weight:800}
.mixtag{position:absolute;right:3px;bottom:3px;font-size:8.5px;font-weight:800;background:var(--ink);color:var(--surface);border-radius:3px;padding:0 3px;line-height:1.35}
.box.mixed{border-style:double!important;border-width:4px!important}
.mixbox{border:1.5px dashed var(--line);border-radius:12px;padding:10px;margin:4px 0 10px}
.mixhead{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.mixhead span{font-size:12px;color:var(--muted)}
.mixrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.mixrow .code{flex:1;min-width:0;font-family:var(--font-num);font-weight:600}
.mixrow .rmx{color:var(--muted)}
.mixadd{width:100%;margin-top:6px;border-style:dashed}
.box.gmove{outline:3px dashed var(--accent);outline-offset:1px;opacity:.85}
.gmbtn{width:100%;margin-bottom:12px}
.datepick{display:flex;align-items:center;gap:8px;margin-bottom:12px;background:var(--surface2);border-radius:12px;padding:8px 10px}
.datepick label{font-weight:700;font-size:14px;white-space:nowrap}
.datepick input{flex:1;min-width:0;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.datepick .btn{min-height:38px;padding:6px 10px;font-size:13px;white-space:nowrap}
.nodate{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px}
.sdbtn{width:100%;margin-bottom:10px}
.ovsave{min-height:36px;padding:6px 12px;font-size:13px}
.imgdlg .panel{max-width:min(96vw,900px);max-height:90vh;overflow:auto;text-align:center}
.imgdlg img{max-width:100%;border:1px solid var(--line);border-radius:8px;margin:8px 0}
.imgopt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.imgopt input{width:22px;height:22px;margin-top:2px;flex:0 0 auto}
.imgopt small{color:var(--muted)}
.shots{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.shots::-webkit-scrollbar{display:none}
.shot{flex:0 0 100%;scroll-snap-align:center;margin:0;display:flex;align-items:flex-start;justify-content:center}
.shot img{max-height:62vh;object-fit:contain}
.shotbar{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:0 4px}
.shotbar span{color:var(--muted)}
.shotdots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0}
.shotdots button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;color:inherit;cursor:pointer}
.shotdots button[aria-current]{background:#111827;color:#fff;border-color:#111827}
#staticView{display:none}
body.nojs > header,body.nojs > main{display:none}
body.nojs #staticView{display:block;padding:12px 14px 40px}
.stv-top h1{font-size:20px;margin:4px 0}
.stv-top p{font-size:12px;color:var(--muted);margin:0 0 8px}
.stv-top nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.stv-top nav a{font-size:13px;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;text-decoration:none}
.stv-co{margin-top:18px;border-top:2px solid var(--line);padding-top:8px}
.stv-co h2{font-size:17px;margin:6px 0} .stv-co h2 small{font-size:12px;color:var(--muted);font-weight:500}
.stv-co h3{font-size:14px;margin:10px 0 4px}
.stv-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px}
.stv-text{white-space:pre-wrap;font-family:var(--font-num);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px}
.calc{font-size:12px;color:var(--muted);margin-bottom:8px;font-family:var(--font-num)}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:10px}
.pal{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:4px;background:var(--surface2)}
.pal .pn{font-size:11px;color:var(--muted);width:28px;text-align:center}
.pal button{border:0;background:var(--surface);width:34px;height:34px;border-radius:8px;font-size:18px;font-weight:600}
.pal b{flex:1;text-align:center;font-family:var(--font-num);font-size:18px}
.pal b.part{color:var(--warn)}
.pal .rm{color:var(--muted);font-size:15px;background:none}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.quick .btn{flex:1;min-width:72px}
.manual{display:flex;gap:6px;margin-bottom:12px}
.manual input{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-family:var(--font-num);font-size:16px}
.infobox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.infobox .prevnum input{width:100%;font-size:22px}
.acts{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.acts .btn{flex:1;min-width:96px}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

.dlg{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(10,12,15,.5);padding:16px}
.dlg.on{display:flex}
.dlg .panel{background:var(--surface);border-radius:14px;padding:16px;max-width:360px;width:100%}
.dlg p{margin:0 0 14px;line-height:1.5}
.dlg .acts{border:0;padding:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;display:none;white-space:nowrap}
.toast.on{display:block}
@media (prefers-reduced-motion: no-preference){ .sheet.on{animation:up .18s ease-out} @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">재고 약도<small id="subline"></small></h1>
    <span class="pill" id="sync">이 기기에 저장</span>
  </div>
  <div class="ctabs" id="ctabs" role="tablist" aria-label="회사"></div>
  <div class="summary" id="summary"></div>
  <div id="snapBanner" style="padding:0 16px"></div>
  <nav class="views" role="tablist" aria-label="보기">
    <button role="tab" id="tab-map" aria-selected="true" data-v="map">약도</button>
    <button role="tab" id="tab-items" aria-selected="false" data-v="items">품목</button>
    <button role="tab" id="tab-share" aria-selected="false" data-v="share">보내기</button>
    <button class="navimg" id="navImg" type="button">이미지 저장</button>
  </nav>
</header>

<main>
  <section class="view on" id="v-map">
    <div id="mapTabs"></div>
    <div id="moveBanner"></div>
    <div class="toolbar">
      <button class="btn on" id="placeBtn" aria-pressed="true">빈칸 누르면 상자 추가</button>
      <button class="btn" id="ovBtn">전체보기</button>
      <button class="btn" id="mlBtn">여러 칸 선택</button>
      <button class="btn" id="flipV" aria-pressed="false">상하 반전</button>
      <button class="btn" id="flipH" aria-pressed="false">좌우 반전</button>
      <div class="seg" aria-label="확대">
        <button id="zOut" aria-label="축소">−</button><span id="zLbl">보통</span><button id="zIn" aria-label="확대">+</button>
      </div>
    </div>
    <div class="mapwrap"><div class="grid" id="grid"></div></div>
    <div class="boxfind">
      <input class="search" id="bq" type="search" placeholder="상자 찾기 · 품번 입력 (예: N2P, 9360)" aria-label="약도에서 상자 찾기" autocomplete="off">
      <div id="bqInfo" class="hint"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="sizer" aria-label="약도 칸 수 조절">
      <span class="sl" id="cLbl">가로 6칸</span>
      <button class="btn" data-sz="c,start,1">+ 왼쪽</button><button class="btn" data-sz="c,start,-1">− 왼쪽</button><button class="btn" data-sz="c,end,-1">− 오른쪽</button><button class="btn" data-sz="c,end,1">+ 오른쪽</button>
      <span class="sl" id="rLbl">세로 10칸</span>
      <button class="btn" data-sz="r,start,1">+ 위</button><button class="btn" data-sz="r,start,-1">− 위</button><button class="btn" data-sz="r,end,-1">− 아래</button><button class="btn" data-sz="r,end,1">+ 아래</button>
      <button class="btn insbtn" id="insBtn">중간에 줄 넣기 · 빼기</button>
    </div>
  </section>

  <section class="view" id="v-items">
    <input class="search" id="q" type="search" placeholder="품번 검색 (예: 9360, NNB)" aria-label="품번 검색">
    <div class="filters" id="filters">
      <button class="chipbtn" aria-pressed="true" data-f="all">전체</button>
      <button class="chipbtn" aria-pressed="false" data-f="todo">미입력</button>
      <button class="chipbtn" aria-pressed="false" data-f="diff">차이 있음</button>
      <button class="chipbtn" aria-pressed="false" data-f="unplaced">약도에 없음</button>
    </div>
    <div id="itemList"></div>
    <details class="card" id="unitCard" style="margin-top:14px">
      <summary><h2 style="display:inline">파렛트 단위 설정</h2></summary>
      <p style="margin-top:8px">품목마다 한 파렛트(묶음)에 몇 개가 들어가는지 정합니다. 수량 입력 화면의 "+ 파렛트" 버튼이 이 숫자로 바뀝니다. 비우면 기본값을 씁니다.</p>
      <div id="unitList"></div>
    </details>
    <div class="card">
      <h2>품목 추가</h2>
      <div class="toolbar" style="margin:0">
        <label class="field">품번 / 항목명<input id="newCode" placeholder="예: T4300 ABC, 시컨스" autocomplete="off"></label>
        <label class="field">구분<select id="newGrp"></select></label>
        <label class="field">종류<select id="newKind"><option value="stock">재고 품목</option><option value="info">정보 (시컨스·공용기 등)</option></select></label>
        <button class="btn primary" id="addItem" style="align-self:flex-end">추가</button>
      </div>
    </div>
  </section>

  <section class="view" id="v-share">
    <div class="card">
      <h2 id="shareTitle">카톡에 붙여넣을 재고 현황</h2>
      <p>보내던 형식 그대로 현재고를 만듭니다. 아직 세지 않은 품목은 숫자를 비워 둡니다.</p>
      <div class="filters">
        <button class="chipbtn" aria-pressed="true" data-o="cur">현재고</button>
        <button class="chipbtn" aria-pressed="false" data-o="cmp">이전→현재</button>
      </div>
      <div class="filters">
        <button class="chipbtn" aria-pressed="false" id="noNote">괄호 특이사항 빼기</button>
      </div>
      <textarea id="out" readonly aria-label="보낼 내용"></textarea>
      <div class="toolbar" style="margin:10px 0 0"><button class="btn primary" id="copyBtn">복사하기</button><button class="btn" id="outImg">이미지로 저장</button></div>
    </div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh-head"><span class="grip"></span><h3 id="shTitle"></h3><button class="x" id="shClose" aria-label="닫기">×</button></div>
  <div class="sh-body" id="shBody"></div>
</div>
<div class="dlg" id="dlg"><div class="panel"><p id="dlgMsg"></p><div class="acts"><button class="btn" id="dlgNo">취소</button><button class="btn primary" id="dlgYes">확인</button></div></div></div>

var EDIT={}; try{ EDIT=JSON.parse(localStorage.getItem("stockmap-editor")||"{}")||{}; }catch(e){ EDIT={}; }
function canEdit(){ return !GAS||!!EDIT.code; }
var SHADOW={}, VER={};
function apiGet(p){ var q=Object.keys(p).map(function(k){return k+"="+encodeURIComponent(p[k]);}).join("&"); return fetch(API+(API.indexOf("?")<0?"?":"&")+q,{cache:"no-store"}).then(function(r){return r.json();}); }
function apiPost(b){ return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)}).then(function(r){return r.json();}); }
function canon(o){ if(Array.isArray(o)) return "["+o.map(canon).join(",")+"]"; if(o&&typeof o==="object") return "{"+Object.keys(o).sort().filter(function(k){return o[k]!==undefined;}).map(function(k){return JSON.stringify(k)+":"+canon(o[k]);}).join(",")+"}"; return JSON.stringify(o===undefined?null:o); }
function same(a,b){ return canon(a)===canon(b); }
/* 두 사람이 같은 탭을 동시에 고쳤을 때: 내가 바꾼 칸만 내 것으로, 나머지는 서버 것으로 */
function merge3(base,local,server){
  if(!server) return local; if(!base) return local;
  var out=JSON.parse(JSON.stringify(server));
  ["boxes","items","maps"].forEach(function(k){
    var B={},L={}; (base[k]||[]).forEach(function(x){B[x.id]=x;}); (local[k]||[]).forEach(function(x){L[x.id]=x;});
    var res=[], seen={};
    (server[k]||[]).forEach(function(sv){ var id=sv.id, b=B[id], l=L[id]; seen[id]=1;
      if(b&&!l){ if(same(b,sv)) return; res.push(sv); return; }
      if(l&&(!b||!same(l,b))){ res.push(l); return; }
      res.push(sv); });
    (local[k]||[]).forEach(function(l){ if(seen[l.id]) return; var b=B[l.id]; if(b&&same(l,b)) return; res.push(l); });
    out[k]=res;
  });
  ["survey","seedV"].forEach(function(k){ if(!same(local[k],base[k])) out[k]=local[k]; });
  return out;
}
var POLL={refs:{},timer:null,busy:false,
  watch:function(cid,ref){ this.refs[cid]=ref; if(!this.timer){ var self=this; this.timer=setTimeout(function(){ self.tick(true); },0);
    setInterval(function(){ if(!document.hidden) self.tick(false); },12000);
    document.addEventListener("visibilitychange",function(){ if(!document.hidden) self.tick(false); }); } },
  tick:async function(first){
    if(this.busy) return; this.busy=true; var self=this;
    try{
      if(first){
        var r=await apiGet({action:"all"}); if(!r.ok) throw r;
        Object.keys(self.refs).forEach(function(cid){ var d=r.docs[cid]; if(d){ VER[cid]=d.v; SHADOW[cid]=d.data; } self.refs[cid]._emit(d?d.data:null); });
      } else {
        var rv=await apiGet({action:"ver"}); if(!rv.ok) throw rv;
        var need=Object.keys(self.refs).filter(function(cid){ var x=S[cid]; return (rv.vers[cid]||0)!==(VER[cid]||0)&&!(x.dirty||x.saving); });
        if(need.length){ var r2=await apiGet({action:"docs",cids:need.join(",")});
          need.forEach(function(cid){ var d=r2.docs&&r2.docs[cid], x=S[cid]; if(!d||x.dirty||x.saving) return; VER[cid]=d.v; SHADOW[cid]=d.data; self.refs[cid]._emit(d.data); }); }
        Object.keys(self.refs).forEach(function(cid){ var x=S[cid]; if(x.err&&x.err.indexOf("연결")>=0){ x.err=null; } });
        syncLabel();
      }
    }catch(e){ Object.keys(self.refs).forEach(function(cid){ if(first) self.refs[cid]._fail(); else { var x=S[cid]; if(!x.dirty&&!x.saving) x.err="연결 안 됨 · 다시 시도 중"; } }); syncLabel(); if(first) setTimeout(function(){ self.busy=false; self.tick(true); },8000); }
    this.busy=false;
  }
};
var histTimers={};
function gasRef(cid){
  var subs=[];
  var ref={
    onSnapshot:function(cb,err){ subs.push({cb:cb,err:err}); POLL.watch(cid,ref); },
    _emit:function(d){ subs.forEach(function(su){ su.cb({exists:!!d,data:function(){ return JSON.parse(JSON.stringify(d)); },metadata:{fromCache:false,hasPendingWrites:false}}); }); },
    _fail:function(){ subs.forEach(function(su){ if(su.err) su.err(); }); },
    set:async function(body){
      if(!canEdit()){ var pe=new Error("auth"); pe.code="permission_denied"; throw pe; }
      var merged=false;
      for(var tries=0;tries<5;tries++){
        var r; try{ r=await apiPost({action:"set",cid:cid,code:EDIT.code,baseV:VER[cid]||0,data:body}); }catch(e){ var ne=new Error("net"); ne.code="unavailable"; throw ne; }
        if(r.ok){ VER[cid]=r.v; SHADOW[cid]=JSON.parse(JSON.stringify(body)); return merged?{merged:body}:{}; }
        if(r.error==="auth"){ EDIT={}; try{ localStorage.removeItem("stockmap-editor"); }catch(e){} var ae=new Error("auth"); ae.code="permission_denied"; throw ae; }
        if(r.conflict){ var base=SHADOW[cid]; VER[cid]=r.v; SHADOW[cid]=r.data; body=merge3(base,body,r.data); merged=true; continue; }
        if(r.error==="busy"){ await sleep(800); continue; }
        var ue=new Error("fail"); ue.code="unavailable"; throw ue;
      }
      var te=new Error("busy"); te.code="unavailable"; throw te;
    },
    collection:function(){ return {
      doc:function(id){ return {set:function(sn){
        if(!canEdit()) return Promise.resolve();
        var st=S[cid]&&S[cid].state, curId=st?st.survey.date+"_"+st.survey.round:"";
        var send=function(){ return apiPost({action:"hist",cid:cid,code:EDIT.code,id:id,data:sn}).catch(function(){}); };
        if(id!==curId) return send();
        clearTimeout(histTimers[cid]); histTimers[cid]=setTimeout(send,60000); return Promise.resolve(); // 지금 회차는 1분에 한 번만
      }}; },
      orderBy:function(){ return {limit:function(n){ return {get:function(){ return apiGet({action:"hist",cid:cid,limit:Math.min(n,80)}).then(function(r){ return {docs:(r.items||[]).map(function(v){ return {data:function(){return v;}}; })}; }); }}; }}; }
    }; }
  };
  return ref;
}

async function makeBackup(btn){
  btn.disabled=true; btn.textContent="모으는 중…";
  await Promise.race([Promise.all(COMPANIES.map(function(c){ return loadHist(c.id).catch(function(){}); })),sleep(8000)]);
  var data={app:"stockmap",v:1,at:Date.now(),states:{},hist:{}};
  COMPANIES.forEach(function(c){ data.states[c.id]=S[c.id].state; data.hist[c.id]=histCache[c.id]||histLocal(c.id); });
  var json=JSON.stringify(data), d=new Date(), fname="재고약도_백업_"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"_"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+".json";
  var blob=new Blob([json],{type:"application/json"}), done=false;
  var dl=null; try{ if(window.claude&&window.claude.use) dl=await window.claude.use("downloads"); }catch(e){}
  if(dl){ try{ await dl.save({filename:fname,data:blob}); done=true; toast("백업 파일을 저장했습니다"); }catch(err){ if(err&&err.code==="declined"){ done=true; toast("저장을 취소했습니다"); } else { try{ await dl.save({filename:fname.replace(/\.json$/,".txt"),data:new Blob([json],{type:"text/plain"})}); done=true; toast("백업 파일을 저장했습니다"); }catch(e2){} } } }
  if(!done){ try{ var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },2000); done=true; toast("백업 파일을 저장했습니다"); }catch(e){} }
  if(!done) toast("백업 파일을 저장하지 못했습니다");
  btn.disabled=false; btn.textContent="전체 백업 파일 받기";
}
async function restoreBackup(file){
  var txt=await file.text(), data=null; try{ data=JSON.parse(txt); }catch(e){}
  if(!data||data.app!=="stockmap"||!data.states){ toast("재고 약도 백업 파일이 아닙니다"); return; }
  closeDlg();
  var when=new Date(data.at||0), wt=when.getFullYear()+"-"+String(when.getMonth()+1).padStart(2,"0")+"-"+String(when.getDate()).padStart(2,"0")+" "+String(when.getHours()).padStart(2,"0")+":"+String(when.getMinutes()).padStart(2,"0");
  ask(wt+" 백업으로 모든 탭을 바꿀까요? 지금 약도·수량은 백업 내용으로 덮어씁니다. 지난 기록도 함께 옮깁니다.","불러오기",async function(){
    toast("불러오는 중… 창을 닫지 마세요");
    COMPANIES.forEach(function(c){ var st=data.states[c.id]; if(!st) return; S[c.id].state=normalize(c,JSON.parse(JSON.stringify(st))); persistId(c.id); });
    // 지난 기록
    var all=[]; Object.keys(data.hist||{}).forEach(function(cid){ var h=data.hist[cid]||{}; Object.keys(h).forEach(function(k){ var v=h[k]; if(v&&v.id&&v.state) all.push({cid:cid,id:v.id,data:v}); }); });
    all.forEach(function(x){ saveHistLocal(x.cid,x.data); });
    if(GAS){ for(var i=0;i<all.length;i+=6){ try{ await apiPost({action:"histBulk",code:EDIT.code,items:all.slice(i,i+6)}); }catch(e){} } }
    else { all.forEach(function(x){ var r=S[x.cid]&&S[x.cid].ref; if(r&&!readOnly) r.collection("history").doc(x.id).set(x.data).catch(function(){}); }); }
    COMPANIES.forEach(function(c){ delete histCache[c.id]; });
    renderAll(); toast("백업을 불러왔습니다 · 탭 "+Object.keys(data.states).length+"개, 기록 "+all.length+"개");
  });
}

function localSave(id){ try{localStorage.setItem(lsKey(id),JSON.stringify(S[id].state));}catch(e){} saveHistLocal(id); }
function snapOf(id){ var st=S[id].state, k=countsSt(st); return {id:st.survey.date+"_"+st.survey.round,date:st.survey.date,round:st.survey.round,savedAt:Date.now(),done:k.done+k.diff,diff:k.diff,n:k.n,state:JSON.parse(JSON.stringify(st))}; }
function histLocal(id){ try{ return JSON.parse(localStorage.getItem("stockmap-hist-"+id)||"{}")||{}; }catch(e){ return {}; } }
function saveHistLocal(id,sn){
  sn=sn||snapOf(id); var h=histLocal(id); h[sn.id]=sn; if(typeof histCache!=="undefined"&&histCache[id]) histCache[id][sn.id]=sn;
  var keys=Object.keys(h).sort(function(a,b){return h[b].savedAt-h[a].savedAt;}); keys.slice(80).forEach(function(k){delete h[k];});
  try{ localStorage.setItem("stockmap-hist-"+id,JSON.stringify(h)); }catch(e){}
}
function saveHistDb(id,sn){
  var x=S[id]; if(!x.ref||readOnly) return; sn=sn||snapOf(id);
  x.histChain=(x.histChain||Promise.resolve()).then(function(){ return x.ref.collection("history").doc(sn.id).set(sn); }).catch(function(){});
}
document.addEventListener("click",function(e){ if(e.target&&e.target.id==="sync") openDataMenu(); });
function setSync(t,cls){ var el=$("sync"); el.textContent=t; el.className="pill"+(cls?" "+cls:""); }
function syncLabel(){
  var x=S[ui.cid];
  if(!dbReady) return setSync("이 기기에 저장");
  if(GAS&&!canEdit()) return setSync(x.got?"보기 전용 · 수정하려면 누르기":"불러오는 중…",x.got?"bad":"");
  if(readOnly) return setSync("보기 전용","bad");
  if(x.err) return setSync(x.err,"bad");
  if(x.dirty||x.saving) return setSync("저장 중…");
  if(!x.got) return setSync("불러오는 중…");
  setSync(GAS?"저장됨 · "+(EDIT.name||""):"저장됨","ok");
}
function persist(){ persistId(ui.cid); }
function persistId(id){
  var x=S[id];
  if(GAS&&!canEdit()){ if(SHADOW[id]) x.state=normalize(CMAP[id],JSON.parse(JSON.stringify(SHADOW[id]))); renderAll(); askCode(); return; }
  x.fresh=false; localSave(id); renderAll();
  if(!x.ref||readOnly){ syncLabel(); return; }
  x.dirty=true; x.err=null; syncLabel(); clearTimeout(x.timer); x.timer=setTimeout(function(){flush(id);},700);
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function flush(id){
  var x=S[id]; if(!x.ref||x.saving) return; x.saving=true;
  while(x.dirty){
    x.dirty=false; var body=JSON.parse(JSON.stringify(x.state));
    try{ var res=await x.ref.set(body);
      if(res&&res.merged){ x.state=normalize(CMAP[id],merge3(body,JSON.parse(JSON.stringify(x.state)),res.merged)); if(x.dirty===false&&!same(x.state,res.merged)) x.dirty=true; localSave(id); renderAll(); if(id===ui.cid) toast("다른 사람이 고친 내용과 합쳤습니다"); }
    }
    catch(e){
      var code=e&&e.code;
      if(code==="permission_denied"){ x.err="수정 권한 없음"; x.saving=false; if(SHADOW[id]) x.state=normalize(CMAP[id],JSON.parse(JSON.stringify(SHADOW[id]))); renderAll(); askCode(); return; }
      if(code==="unavailable"){ await sleep(600+Math.random()*900); try{ await x.ref.set(body); continue; }catch(e2){ code=e2&&e2.code; } }
      if(code==="invalid_argument") readOnly=true;
      else x.err=code==="quota_exceeded"?"저장 공간 가득 참":"이 기기에만 저장됨";
      x.saving=false; syncLabel(); return;
    }
  }
  x.saving=false; syncLabel(); saveHistDb(id);
}
async function connect(){
  var db=null;
  if(window.claude&&window.claude.use){ try{ db=await window.claude.use("db"); }catch(e){} }
  else if(GAS){ db={doc:function(p){ return gasRef(String(p).split("/")[1]); }}; }
  else return;
  if(!db){ rollAll(); return; }
  dbReady=true; syncLabel();
  COMPANIES.forEach(function(c){
    var x=S[c.id];
    try{ x.ref=db.doc("inventory/"+c.id); }catch(e){ return; }
    var timer=setTimeout(function(){ if(!x.got){ x.err="연결 대기 · 이 기기에 저장"; if(c.id===ui.cid) syncLabel(); } },10000);
    x.ref.onSnapshot(function(snap){
      if(!snap.metadata.fromCache){ x.got=true; clearTimeout(timer); if(x.err&&x.err.indexOf("연결")===0) x.err=null; }
      if(snap.metadata.hasPendingWrites||x.saving||x.dirty) return;
      if(snap.exists){ x.state=normalize(c,snap.data()); x.fresh=false; localSave(c.id); renderAll(); }
      else if(GAS&&canEdit()&&!snap.metadata.fromCache){ x.got=true; persistId(c.id); } // 서버에 아직 없으면 지금 데이터를 올림
      if(x.got){ autoRoll(c.id); fillFromLast(c.id); }
      if(c.id===ui.cid) syncLabel(); else renderCtabs();
    },function(){ clearTimeout(timer); x.err="이 기기에만 저장됨"; if(c.id===ui.cid) syncLabel(); });
  });
}

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function item(id){ var a=ST().items; for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function box(id){ var a=ST().boxes; for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function boxAt(r,c,t){ var a=ST().boxes, m=MAP().id; t=t||0; for(var i=0;i<a.length;i++){var b=a[i]; if(b.mapId===m&&b.r===r&&b.c===c&&(b.t||0)===t) return b;} return null; }
function grp(k){ var g=C().groups; for(var i=0;i<g.length;i++) if(g[i].k===k) return g[i]; return g[0]; }
function sumA(a){ return a?a.reduce(function(x,y){return x+y;},0):0; }

function drawTextCanvas(txt){
  var sc=2, W=720, pad=28, fs=17, lh=26, font='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif';
  var m=document.createElement("canvas").getContext("2d"); m.font=fs+"px "+font;
  var lines=[]; String(txt).split("\n").forEach(function(ln){
    if(!ln){ lines.push(""); return; }
    var cur=""; Array.from(ln).forEach(function(ch){ if(m.measureText(cur+ch).width>W-pad*2&&cur){ lines.push(cur); cur="  "+ch; } else cur+=ch; }); lines.push(cur);
  });
  var H=pad*2+lines.length*lh;
  var cv=document.createElement("canvas"); cv.width=W*sc; cv.height=H*sc; var x=cv.getContext("2d"); x.scale(sc,sc);
  x.fillStyle="#ffffff"; x.fillRect(0,0,W,H); x.textBaseline="middle";
  lines.forEach(function(ln,i){ var y=pad+i*lh+lh/2, head=ln.trim()&&(i===0||!lines[i-1].trim());
    x.font=(head?"700 ":"")+fs+"px "+font; x.fillStyle=head?"#111827":"#1f2937"; x.fillText(ln,pad,y); });
  return cv;
}

  if(it.kind!=="info"){
    var bs=boxesOf(it.id);
    if(bs.length||it.cur!==null) h+='<div class="spots">'+bs.map(function(x){ return '<div class="spot'+(b&&x.id===b.id?" me":"")+'"><span>'+esc(spotName(x))+'</span><b>'+(x.cur===null?"미입력":esc(breakdown(it,x.cur)))+'</b></div>'; }).join("")+(it.cur!==null?'<div class="spot"><span>약도 밖</span><b>'+esc(breakdown(it,it.cur))+'</b></div>':'')+'</div>';
  }
  $("shBody").innerHTML=h;
}
$("mapTabs").addEventListener("click",function(e){ var t=e.target.closest("[data-map]"); if(!t) return; ui.multi=null; ui.groupMove=null; ui.map[ui.cid]=t.dataset.map; try{localStorage.setItem("stockmap-mapsel",JSON.stringify(ui.map));}catch(e2){} renderMap(); });
$("addItem").onclick=function(){
  if(ro()) return; var kind=$("newKind").value, raw=$("newCode").value.trim().replace(/\s+/g," ");
  if(!raw){toast("품번이나 항목명을 입력하세요");return;}
  var code=kind==="info"?raw:raw.toUpperCase(), st=ST();
  if(st.items.some(function(it){return it.code===code&&it.group===$("newGrp").value;})){toast("같은 구분에 이미 있습니다");return;}
  st.items.push(kind==="info"?{id:uid(),kind:"info",code:code,alias:"",group:$("newGrp").value,prev:null,note:"",cur:null,unit:null}
    :{id:uid(),kind:"stock",code:code,alias:"",group:$("newGrp").value,prev:null,note:"",cur:null,unit:null});
  $("newCode").value=""; persist(); toast(code+" 추가됨");
};

var h0=(location.hash||"").slice(1); if(["map","items","share"].indexOf(h0)>=0) showView(h0);
window.addEventListener("hashchange",function(){ var h=(location.hash||"").slice(1); if(["map","items","share"].indexOf(h)>=0&&h!==ui.view) showView(h); });
renderAll();
setTimeout(function(){ var a=document.querySelector('.ctab[aria-selected="true"]'); if(a&&a.scrollIntoView) a.scrollIntoView({inline:"center",block:"nearest"}); },0);
/* 날짜가 바뀌면 그날 1차 조사로 자동 전환 (전날 회차는 기록에 남고, 수량은 비움 · 지난 기록에서 불러오기 가능) */
function autoRoll(id){
  if(GAS&&!canEdit()) return false;
  var x=S[id], st=x.state, d=today();
  if(!st||!st.survey||st.survey.manual||st.survey.date>=d||x.dirty||x.saving) return false;
  var had=st.items.some(function(it){return total(it,st)!==null;})||st.boxes.some(function(b){return b.cur!==null||b.seq;});
  if(had){ var sn=snapOf(id); saveHistLocal(id,sn); saveHistDb(id,sn); }
  st.items.forEach(function(it){
    if(it.kind==="info"){ var tv=total(it,st); if(it.cur!==null||tv!==null) it.prev=tv!==null?tv:it.cur; it.cur=null; return; }
    var t=total(it,st); if(t!==null) it.prev=t; // 갯수는 지난 조사 그대로 채워 둠
  });
  st.survey={date:d,round:1,filled:true};
  persistId(id);
  if(id===ui.cid){ if(ui.snap) ui.snap=null; toast(fmtDate(d)+" 1차 조사로 바뀌었습니다 · 지난 회차는 기록에 저장됨"); }
  return true;
}
/* 새 날짜 1차가 비어 있으면 바로 전 조사의 갯수로 채움 (한 번만) */
function emptyCounts(st){ return !st.items.some(function(it){ return it.kind!=="info"&&it.cur!==null; })&&!st.boxes.some(function(b){ return b.cur!==null||b.seq||(b.mix||[]).some(function(m){return m.cur!==null;}); }); }
function copyCounts(st,src){
  var sb={}, sp={}, si={}; src.boxes.forEach(function(b){ sb[b.id]=b; sp[b.mapId+"|"+b.r+"|"+b.c+"|"+(b.t||0)+"|"+b.itemId]=b; });
  src.items.forEach(function(it){ si[it.id]=it; });
  var n=0;
  st.boxes.forEach(function(b){
    var o=sb[b.id]; if(!o||o.itemId!==b.itemId) o=sp[b.mapId+"|"+b.r+"|"+b.c+"|"+(b.t||0)+"|"+b.itemId]; if(!o) return;
    if(b.cur===null&&o.cur!=null){ b.cur=JSON.parse(JSON.stringify(o.cur)); n++; }
    if(!b.seq&&o.seq){ b.seq=JSON.parse(JSON.stringify(o.seq)); n++; }
    (b.mix||[]).forEach(function(m){ var om=(o.mix||[]).filter(function(z){return z.itemId===m.itemId;})[0]; if(m.cur===null&&om&&om.cur!=null){ m.cur=JSON.parse(JSON.stringify(om.cur)); n++; } });
  });
  st.items.forEach(function(it){ var o=si[it.id]; if(it.kind!=="info"&&it.cur===null&&o&&Array.isArray(o.cur)){ it.cur=o.cur.slice(); n++; } });
  return n;
}
var filling={};
async function fillFromLast(id){
  if(GAS&&!canEdit()) return;
  var x=S[id], st=x&&x.state; if(!st||!st.survey||st.survey.filled||st.survey.closed||st.survey.round!==1||filling[id]) return;
  if(!emptyCounts(st)){ return; }
  filling[id]=true;
  try{
    await loadHist(id);
    st=x.state; if(!st||st.survey.filled||st.survey.closed||st.survey.round!==1||!emptyCounts(st)||x.dirty||x.saving) return;
    var d=st.survey.date, h=histCache[id]||{};
    var recs=Object.keys(h).map(function(k){return h[k];}).filter(function(v){ return v&&v.state&&v.date<d&&!emptyCounts(normalize(COMPANIES.filter(function(c){return c.id===id;})[0],JSON.parse(JSON.stringify(v.state)))); })
      .sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:(b.round-a.round)||(b.savedAt-a.savedAt); });
    if(!recs.length) return;
    var src=normalize(COMPANIES.filter(function(c){return c.id===id;})[0],JSON.parse(JSON.stringify(recs[0].state)));
    var n=copyCounts(st,src); st.survey.filled=true; persistId(id);
    if(n&&id===ui.cid) toast(fmtDate(recs[0].date)+" "+recs[0].round+"차 갯수로 채웠습니다");
  } finally { filling[id]=false; }
}
function rollAll(){ COMPANIES.forEach(function(c){ var x=S[c.id]; if(!x.ref||x.got){ autoRoll(c.id); fillFromLast(c.id); } }); }
connect();
setTimeout(function(){ if(!dbReady) rollAll(); },0);
setInterval(rollAll,60000);
document.addEventListener("visibilitychange",function(){ if(!document.hidden) rollAll(); });
})();
